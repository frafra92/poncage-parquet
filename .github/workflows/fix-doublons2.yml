name: Fix doublons bucket1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fusionne les doublons
        run: python3 fix_doublons2.py
      - name: Regenere le sitemap
        run: python3 generate_sitemap.py
      - name: Nettoyage et commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch fix_doublons2.py .github/workflows/fix-doublons2.yml
          git add -A
          git diff --cached --quiet || git commit -m "Bucket 1 : fusion doublons glossaire + point de Hongrie [skip ci]"
          git push
