name: deploy-prix-update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract payload
        run: |
          echo '' | base64 -d > /tmp/x.tgz
          echo '9cdad3f79612c3a763ea02f4469845f493e19b7086fd1342efe7b5db4907275d  /tmp/x.tgz' | sha256sum -c -
          tar xzf /tmp/x.tgz -C .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/deploy-prix-update.yml
          git add -A
          git commit -m "Page prix: +3 FAQ longue traine (prix renovation, au m2, prix fixe) + correction formulation garanti"
          git push
