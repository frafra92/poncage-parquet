name: Fix entretien

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Appliquer le correctif entretien
        run: python fix_entretien.py
      - name: Committer
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a modifier."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Page entretien : ciblage nettoyage (title/meta/H1) + FAQ + dates a jour"
            git push
          fi
