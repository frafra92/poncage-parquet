name: deploy-entretien-update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract payload
        run: |
          echo '' | base64 -d > /tmp/x.tgz
          echo 'a22220b196bf0913cf67d81e6369371223f767da808bd10b4e25f5ff98870bc8  /tmp/x.tgz' | sha256sum -c -
          tar xzf /tmp/x.tgz -C .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/deploy-entretien-update.yml
          git add -A
          git commit -m "Page entretien/nettoyage: +2 FAQ (entreprise nettoyage parquet Paris, parquet terne) + miroir .md resync"
          git push
