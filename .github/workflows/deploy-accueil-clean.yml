name: deploy-accueil-clean
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract payload
        run: |
          echo '' | base64 -d > /tmp/x.tgz
          echo '3d17a87ada5855808582319ebdf39993d740f28267cb5881e528a4de496d5de4  /tmp/x.tgz' | sha256sum -c -
          tar xzf /tmp/x.tgz -C .
      - name: Regenerate sitemap
        run: python3 generate_sitemap.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/deploy-accueil-clean.yml
          git add -A
          git commit -m "Accueil: nettoyage markup avant head + retrait schema HowTo et Article + sitemap"
          git push
