name: deploy-batch-jaune
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract payload
        run: |
          echo '' | base64 -d > /tmp/x.tgz
          echo 'f8c7ea0416e7de73aa1f933a2b808aab30522b4f35b50a7528dfa6a6ec997661  /tmp/x.tgz' | sha256sum -c -
          tar xzf /tmp/x.tgz -C .
      - name: Regenerate sitemap
        run: python3 generate_sitemap.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/deploy-batch-jaune.yml
          git add -A
          git commit -m "Lot jaune: rayures, chevron/batons rompus, salle de bain bois exotique + maillage + sitemap"
          git push
