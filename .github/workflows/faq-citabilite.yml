name: faq-citabilite
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply FAQ edits
        env:
          B64: ''
        run: |
          printf '%s' "$B64" | base64 -d | gunzip > apply_faq.py
          python3 apply_faq.py .
          rm -f apply_faq.py
          git config user.name "frafra92"
          git config user.email "francoisgaillard92@outlook.fr"
          git rm -f --ignore-unmatch .github/workflows/faq-citabilite.yml >/dev/null 2>&1 || true
          git add -A
          git commit -m "FAQ citable: prix + guide étapes (AEO) [skip ci]" || echo "rien à committer"
          git push
