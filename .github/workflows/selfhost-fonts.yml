name: Auto-hebergement polices
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installe les polices via npm
        run: npm install @fontsource/cormorant-garamond @fontsource/jost
      - name: Build (woff2 + css + patch des pages)
        run: python3 build_fonts.py
      - name: Nettoyage et commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf node_modules package.json package-lock.json
          git rm -f --ignore-unmatch build_fonts.py .github/workflows/selfhost-fonts.yml
          git add -A
          git diff --cached --quiet || git commit -m "Auto-hebergement des polices (RGPD + performance) [skip ci]"
          git push
