name: Nettoyage one-shot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supprime les scripts et workflows one-shot epuises
        run: |
          git rm -f --ignore-unmatch fix_ancres.py fix_datemod.py .github/workflows/fix-ancres.yml .github/workflows/fix-dates.yml .github/workflows/cleanup.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Nettoyage des scripts one-shot epuises [skip ci]"
          git push
