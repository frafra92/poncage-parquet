name: Fix maillage piliers
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renforce le maillage vers les piliers
        run: python3 fix_maillage.py
      - name: Nettoyage et commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch fix_maillage.py .github/workflows/fix-maillage.yml
          git add -A
          git diff --cached --quiet || git commit -m "Maillage interne : liens vers piliers poncage et vitrification [skip ci]"
          git push
