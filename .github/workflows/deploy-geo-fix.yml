name: deploy-geo-fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract payload
        run: |
          echo '' | base64 -d > /tmp/x.tgz
          echo 'ad54bbbc0fd7158932bc4b001bd8a6496c692fe37331a6b05ad987c6d9466c21  /tmp/x.tgz' | sha256sum -c -
          tar xzf /tmp/x.tgz -C .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/deploy-geo-fix.yml
          git add -A
          git commit -m "Schema LocalBusiness: alignement coordonnees geo sur pin Google Business + GeoCircle areaServed (accueil, Montrouge, AEO)"
          git push
