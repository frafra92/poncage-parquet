name: deploy-ahrefs-analytics
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract script
        run: |
          echo '' | base64 -d > /tmp/x.tgz
          echo '5692c57f435181600ecfca2c809b4b0b0bab2621a4c1d56f43d38e51c3bba1b9  /tmp/x.tgz' | sha256sum -c -
          tar xzf /tmp/x.tgz -C /tmp
      - name: Inject Ahrefs tag site-wide
        run: python3 /tmp/inject_ahrefs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/deploy-ahrefs-analytics.yml
          git add -A
          git commit -m "Ajout tag Ahrefs Web Analytics sur toutes les pages (avant </head>)"
          git push
