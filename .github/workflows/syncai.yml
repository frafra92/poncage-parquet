name: syncai
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resync AI layer
        env:
          B64: ''
        run: |
          printf '%s' "$B64" | base64 -d > sync_ai_layer.py
          python3 sync_ai_layer.py
          rm -f sync_ai_layer.py
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -f --ignore-unmatch .github/workflows/syncai.yml
          git add -A
          git commit -m "Resync couche IA : llms.txt/llms-full.txt + miroirs .md alignes sur les redirections [skip ci]"
          git push
