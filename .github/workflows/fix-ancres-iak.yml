name: Fix ancres IAK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applique les ancres et le sommaire
        run: python3 fix_ancres_iak.py
      - name: Nettoyage et commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch fix_ancres_iak.py .github/workflows/fix-ancres-iak.yml
          git add -A
          git diff --cached --quiet || git commit -m "Ancres + sommaire sur IA Knowledge Pack [skip ci]"
          git push
