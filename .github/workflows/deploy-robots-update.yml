name: deploy-robots-update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract payload
        run: |
          echo '' | base64 -d > /tmp/x.tgz
          echo '20a08a0382ecd40cbaaaa05d69284612fc6cb30329570f318fc21e74e69337f9  /tmp/x.tgz' | sha256sum -c -
          tar xzf /tmp/x.tgz -C .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/deploy-robots-update.yml
          git add -A
          git commit -m "robots.txt: bloc explicite autres robots IA (GrokBot, Meta-ExternalAgent/Fetcher, Applebot-Extended, Amazonbot, Bytespider)"
          git push
