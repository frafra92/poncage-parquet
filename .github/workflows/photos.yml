name: photos-chantiers
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire photos
        env:
          B64: ''
        run: |
          printf '%s' "$B64" | base64 -d | gunzip > wire_photos.py
          python3 wire_photos.py
          rm -f wire_photos.py
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -f --ignore-unmatch .github/workflows/photos.yml
          git add -A
          git commit -m "Realisations chantiers 8e/20e/Plessis-Robinson : pages lieu + galerie + photo artisan a-propos [skip ci]"
          git push
