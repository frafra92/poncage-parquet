name: deploy-houzz
on: workflow_dispatch
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: edits
        run: |
          python3 - <<'PY'
          import re, pathlib
          H = "https://www.houzz.fr/pro/francois-gaillard11"
          A = "hotfrog.fr/company/5fcbe10c3e4e1781cfc7a1c787382558"
          P = ["index.html",
               "a-propos-francois-gaillard-parqueteur-paris.html",
               "poncage-parquet-montrouge.html",
               "prix-poncage-parquet-paris.html",
               "specialiste-parquet-ancien-paris.html"]
          for f in P:
              p = pathlib.Path(f)
              s = p.read_text(encoding="utf-8")
              o = s
              out = []
              for ln in s.split("\n"):
                  out.append(ln)
                  if A in ln:
                      ind = re.match(r"\s*", ln).group(0)
                      out.append(ind + '"' + H + '",')
              s = "\n".join(out)
              s = re.sub(r'(\n\s*"' + re.escape(H) + r'",)(\s*\n\s*"' + re.escape(H) + r'",)+', r"\1", s)
              if f == "index.html":
                  s = s.replace('houzz.fr/pro/francoisgaillard"', 'houzz.fr/pro/francois-gaillard11"')
              if s != o:
                  p.write_text(s, encoding="utf-8")
                  print("changed", f)
          PY
      - name: commit
        run: |
          rm -f .github/workflows/deploy-houzz.yml
          git config user.name "François Gaillard"
          git config user.email "frafra92@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Ajout Houzz au sameAs (5 pages cles) + correction lien Houzz en pied de page"
          git push
