name: deploy-lcp-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: edits
        run: |
          python3 - <<'PY'
          import pathlib, re
          q = pathlib.Path("style-quartiers.css")
          cs = q.read_text(encoding="utf-8")
          if "html{font-size:17px}" not in cs:
              q.write_text("html{font-size:17px}\n" + cs, encoding="utf-8")
              print("quartiers 17px ajoute")
          def defer(fn):
              p = pathlib.Path(fn); s = p.read_text(encoding="utf-8"); o = s
              for css in ["style-utilities.css", "style-shared.css"]:
                  if 'onload="this.media=\'all\'" href="' + css in s:
                      continue
                  m = re.search(r'<link rel="stylesheet" href="(' + re.escape(css) + r'\?v=\d+)">', s)
                  if not m:
                      continue
                  href = m.group(1)
                  dfr = ('<link rel="stylesheet" media="print" onload="this.media=\'all\'" href="'
                         + href + '"><noscript><link rel="stylesheet" href="' + href + '"></noscript>')
                  s = s.replace(m.group(0), dfr, 1)
              if s != o:
                  p.write_text(s, encoding="utf-8")
                  print("defere", fn)
          defer("poncage-parquet-paris-11.html")
          PY
      - name: commit
        run: |
          rm -f .github/workflows/deploy-lcp-test.yml
          git config user.name "François Gaillard"
          git config user.email "frafra92@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Perf/LCP test (Paris 11e): CSS non-critique differe + base 17px en CSS bloquant"
          git push
