name: fix-ferme-24h
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          python3 - <<'EOF'
          import glob
          old = "tarif ferme dans la journée"
          new = "tarif ferme sous 24h"
          total = 0
          for p in glob.glob("**/*.html", recursive=True) + glob.glob("**/*.md", recursive=True):
              try:
                  s = open(p, encoding="utf-8").read()
              except Exception:
                  continue
              if old in s:
                  open(p, "w", encoding="utf-8").write(s.replace(old, new))
                  total += s.count(old)
                  print(p)
          print("TOTAL", total)
          EOF
          git config user.name "frafra92"
          git config user.email "francoisgaillard92@outlook.fr"
          git rm -f --ignore-unmatch .github/workflows/fix-ferme-24h.yml >/dev/null 2>&1 || true
          git add -A
          git commit -m "Harmonise: tarif ferme sous 24h [skip ci]" || echo "rien a committer"
          git push
