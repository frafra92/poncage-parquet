name: fix-ferme-24h
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        env:
          B64: ''
        run: |
          printf '%s' "$B64" | base64 -d | gunzip > fix_24h.py
          python3 fix_24h.py
          rm -f fix_24h.py
          git config user.name "frafra92"
          git config user.email "francoisgaillard92@outlook.fr"
          git rm -f --ignore-unmatch .github/workflows/fix-ferme-24h.yml >/dev/null 2>&1 || true
          git add -A
          git commit -m "Harmonise: tarif ferme sous 24h [skip ci]" || echo "rien a committer"
          git push
