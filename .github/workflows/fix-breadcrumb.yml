name: Fix breadcrumb
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajoute les BreadcrumbList manquants
        run: python3 fix_breadcrumb.py
      - name: Nettoyage et commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch fix_breadcrumb.py .github/workflows/fix-breadcrumb.yml
          git add -A
          git diff --cached --quiet || git commit -m "Breadcrumb JSON-LD sur 4 pages [skip ci]"
          git push
