name: fix-devis-24h
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        env:
          B64: ''
        run: |
          printf '%s' "$B64" | base64 -d | gunzip > fix_devis.py
          python3 fix_devis.py
          rm -f fix_devis.py
          git config user.name "frafra92"
          git config user.email "francoisgaillard92@outlook.fr"
          git rm -f --ignore-unmatch .github/workflows/fix-devis-24h.yml >/dev/null 2>&1 || true
          git add -A
          git commit -m "Fix: Devis en 24h (au lieu de 3 secondes) [skip ci]" || echo "rien a committer"
          git push
