name: bucket2-histoire
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and run
        env:
          B64: ''
        run: |
          printf '%s' "$B64" | base64 -d > bucket2.py
          python3 bucket2.py
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          rm -f bucket2.py
          git rm -f --ignore-unmatch .github/workflows/bucket2.yml
          git add -A
          git commit -m "Bucket 2 : concentration cluster histoire (13 -> 3 pages) [skip ci]"
          git push
