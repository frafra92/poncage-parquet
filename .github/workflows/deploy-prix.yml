name: deploy-prix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: edits
        run: |
          python3 - <<'PY'
          import pathlib
          R = [
          ("blog-prix-poncage-parquet-paris.html",
           "        <th>Tarif HT</th>",
           "        <th>Tarif</th>"),
          ("blog-prix-poncage-parquet-paris.html",
          '''      <tr>
                  <td>Ponçage — appartement <strong>vide avec ascenseur</strong></td>
                  <td><strong>20 €/m²</strong></td>
                </tr>
                <tr>
                  <td>Ponçage — appartement <strong>vide sans ascenseur</strong></td>
                  <td><strong>30 €/m²</strong></td>
                </tr>
                <tr>
                  <td>Vitrification Bona Mega Evo 3 couches</td>
                  <td><strong>30 €/m²</strong></td>
                </tr>
                <tr>
                  <td>Supplément appartement <strong>meublé</strong></td>
                  <td><strong>+220 € par étape</strong></td>
                </tr>''',
          '''      <tr>
                  <td>Ponçage machine planétaire HTC</td>
                  <td><strong>30 €/m² HT</strong></td>
                </tr>
                <tr>
                  <td>Vitrification Bona Mega Evo 3 couches avec égrenage</td>
                  <td><strong>30 €/m² HT</strong></td>
                </tr>
                <tr>
                  <td><strong>Tarif fixe tout compris</strong> (ponçage + vitrification + déplacement)</td>
                  <td><strong>66 €/m² TTC</strong></td>
                </tr>'''),
          ("blog-prix-poncage-parquet-paris.html",
          '''  <h3>📐 50 m² vide, avec ascenseur — Ponçage + Vitrification</h3>
            <p>
              Ponçage : 50 × 20€ = <strong>1 000€ HT</strong><br>
              Vitrification Bona Mega Evo : 50 × 30€ = <strong>1 500€ HT</strong><br>
              <strong>Total : 2 500€ HT — soit 2 750€ TTC (TVA 10%)</strong>
          </p>''',
          '''  <h3>📐 50 m² — Ponçage + Vitrification tout compris</h3>
            <p>
              50 m² × 66 € TTC/m² = <strong>3 300 € TTC</strong><br>
              Tarif fixe tout compris : ponçage + vitrification Bona Mega Evo 3 couches + déplacement. Aucun supplément.
          </p>'''),
          ("blog-prix-poncage-parquet-paris.html",
          '''  <h3>📐 30 m² vide, sans ascenseur — Ponçage seul</h3>
            <p>
              Ponçage : 30 × 30€ = <strong>900€ HT — soit 990€ TTC</strong>
          </p>''',
          '''  <h3>📐 30 m² — Ponçage + Vitrification tout compris</h3>
            <p>
              30 m² × 66 € TTC/m² = <strong>1 980 € TTC</strong>, tout compris.
          </p>'''),
          ("blog-artisan-independant-parquet-paris.html",
           "Mes tarifs sont affichés publiquement : 20€/m² ponçage avec ascenseur, 30€/m² sans ascenseur, 30€/m² vitrification Bona Mega Evo.",
           "Mon tarif est affiché publiquement : 66 € TTC/m², tarif fixe tout compris (ponçage + vitrification Bona Mega Evo 3 couches + déplacement). Aucun supplément, aucune surprise."),
          ("blog-avant-vente-parquet-paris.html",
           "Investissement ponçage + vitrification : 60m² × (20 + 30€) = <strong>3 000€ TTC</strong>",
           "Investissement ponçage + vitrification : 60 m² × 66 € TTC/m² = <strong>3 960 € TTC</strong>"),
          ("blog-avant-vente-parquet-paris.html",
           "ROI : <strong>3x à 5x l'investissement</strong>",
           "ROI : <strong>2x à 4x l'investissement</strong>"),
          ("blog.html",
           "ROI concret : 3 000 € investis pour",
           "ROI concret : 3 960 € investis pour"),
          ("blog-bona-mega-evo-parquet.html",
           "30€/m² · 3 couches · Résultat garanti · Devis gratuit sous 24h",
           "66 €/m² tout compris · 3 couches · Devis gratuit sous 24h"),
          ]
          ok=0; skipped=0; bad=[]
          for fn, old, new in R:
              p=pathlib.Path(fn); s=p.read_text(encoding="utf-8")
              c=s.count(old)
              if c==1:
                  s=s.replace(old,new,1); p.write_text(s,encoding="utf-8"); ok+=1
              elif c==0 and new in p.read_text(encoding="utf-8"):
                  skipped+=1
              else:
                  bad.append((fn, old[:50], c))
          print("OK:",ok," SKIP:",skipped," BAD:",bad)

          PY
      - name: commit
        run: |
          rm -f .github/workflows/deploy-prix.yml
          git config user.name "François Gaillard"
          git config user.email "frafra92@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Correction tarif (ancien modele -> 66 EUR TTC/m2 tout compris) + retrait Resultat garanti"
          git push
