name: Fix avis
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deduplique les notes aggregateRating
        run: python3 fix_avis.py
      - name: Nettoyage et commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch fix_avis.py .github/workflows/fix-avis.yml
          git add -A
          git diff --cached --quiet || git commit -m "Fix extraits d'avis : une seule note par page [skip ci]"
          git push
