name: deploy-batch-orange
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract payload
        run: |
          base64 -d > /tmp/x.tgz <<'B64EOF'

B64EOF
          echo "1268fc3a42998dc7099ec0040daf6c5d397d81c6c8a86e8863433712e1e97473  /tmp/x.tgz" | sha256sum -c -
          tar xzf /tmp/x.tgz -C .
      - name: Regenerate sitemap
        run: python3 generate_sitemap.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/deploy-batch-orange.yml
          git add -A
          git commit -m "Nouveau lot: parquet noirci, gondole, types de parquet, escalier + teinte (ni cerusé/blanchi) + maillage + sitemap"
          git push
