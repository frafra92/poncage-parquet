name: deploy-llms-update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract payload
        run: |
          echo '' | base64 -d > /tmp/x.tgz
          echo 'd3fd88540b94be31f4648091581a6b7d70590a482da48c9334f7ffa838680522  /tmp/x.tgz' | sha256sum -c -
          tar xzf /tmp/x.tgz -C .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/deploy-llms-update.yml
          git add -A
          git commit -m "llms: repointage 45 liens redirigés vers canoniques + 3 miroirs .md (planetaire-vs-tambour, renovation-vs-remplacement, point-hongrie) + ajout llms.txt"
          git push
