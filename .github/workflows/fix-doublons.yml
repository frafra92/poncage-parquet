name: Fix doublons communes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolide les doublons + fix polices
        run: python3 fix_doublons.py
      - name: Regenere le sitemap
        run: python3 generate_sitemap.py
      - name: Nettoyage et commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch fix_doublons.py .github/workflows/fix-doublons.yml
          git add -A
          git diff --cached --quiet || git commit -m "Consolidation doublons communes + fix polices [skip ci]"
          git push
