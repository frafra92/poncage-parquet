name: poussiere
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reformuler poussiere
        env:
          B64: ''
        run: |
          printf '%s' "$B64" | base64 -d | gunzip > fix_poussiere.py
          python3 fix_poussiere.py
          rm -f fix_poussiere.py
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -f --ignore-unmatch .github/workflows/poussiere.yml
          git add -A
          git commit -m "Reformulation precise poussiere : dispersion tres reduite / aspiration a la source (corps, hors titres SEO) [skip ci]"
          git push
