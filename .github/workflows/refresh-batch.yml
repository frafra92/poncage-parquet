name: Refresh lot 1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Appliquer le refresh
        run: python refresh_batch.py

      - name: Committer les changements
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a modifier."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh lot 1 : FAQ + dates (accueil, prix, Montrouge, 15e, 7e) + page for-ai"
            git push
          fi
