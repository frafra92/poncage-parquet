name: deploy-maillage
on: workflow_dispatch
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: edits
        run: |
          python3 - <<'PY'
          import pathlib
          PRIX="prix-poncage-parquet-paris.html"
          SERV="services-poncage-vitrification-parquet-paris.html"
          DEVIS="devis-poncage-parquet-paris.html"
          EXP="expert-poncage-parquet-paris.html"
          SPEC="specialiste-parquet-ancien-paris.html"
          def P(inner): return '<p class="maillage-argent"><strong>Pour aller plus loin :</strong> ' + inner + '</p>'
          SNIP = {
          "blog-artisan-independant-parquet-paris.html": P('''découvrez <a href="''' + EXP + '''">mon approche d'expert du ponçage à Paris</a>, mon savoir-faire sur le <a href="''' + SPEC + '''">parquet ancien et le point de Hongrie</a>, ou <a href="''' + DEVIS + '''">demandez votre devis gratuit par SMS</a>.'''),
          "blog-avant-vente-parquet-paris.html": P('''consultez <a href="''' + PRIX + '''">le détail de mes tarifs de ponçage et de vitrification</a>, l'ensemble de <a href="''' + SERV + '''">mes prestations de rénovation de parquet</a>, ou <a href="''' + DEVIS + '''">demandez un devis gratuit avant votre vente</a>.'''),
          "blog-bona-mega-evo-parquet.html": P('''découvrez <a href="''' + SERV + '''">mon service de ponçage et de vitrification</a> et <a href="''' + PRIX + '''">mes tarifs tout compris au m²</a>.'''),
          "blog-combien-fois-poncer-parquet.html": P('''découvrez <a href="''' + SERV + '''">comment je rénove un parquet ancien</a>, <a href="''' + PRIX + '''">mes tarifs au m² tout compris</a>, ou <a href="''' + DEVIS + '''">demandez un diagnostic et un devis gratuits</a>.'''),
          "blog-parquet-haussmannien-paris.html": P('''découvrez mon savoir-faire de <a href="''' + SPEC + '''">spécialiste du parquet ancien et haussmannien</a>, <a href="''' + PRIX + '''">mes tarifs de rénovation au m²</a>, ou <a href="''' + DEVIS + '''">demandez votre devis gratuit par SMS</a>.'''),
          "blog-poncage-sans-poussiere.html": P('''découvrez <a href="''' + SERV + '''">mon service de ponçage avec aspiration à la source</a>, <a href="''' + PRIX + '''">mes tarifs tout compris</a>, ou <a href="''' + DEVIS + '''">demandez un devis gratuit</a>.'''),
          "blog-prix-poncage-parquet-paris.html": P('''consultez <a href="''' + PRIX + '''">ma page complète des tarifs de ponçage à Paris</a> ou <a href="''' + DEVIS + '''">demandez votre devis gratuit par SMS</a>.'''),
          "blog-urgence-parquet-paris.html": P('''<a href="''' + DEVIS + '''">demandez un devis en urgence par SMS</a>, consultez <a href="''' + PRIX + '''">mes tarifs tout compris</a>, ou découvrez <a href="''' + SERV + '''">l'ensemble de mes prestations</a>.'''),
          "guide-complet-poncage-parquet-paris.html": P('''découvrez <a href="''' + SERV + '''">l'ensemble de mes prestations de ponçage et de vitrification</a>, <a href="''' + EXP + '''">mon approche d'expert à Paris</a>, ou <a href="''' + DEVIS + '''">demandez votre devis gratuit par SMS</a>.'''),
          "guide-poncage-parquet-etapes.html": P('''confiez votre chantier à un professionnel : découvrez <a href="''' + SERV + '''">mon service de ponçage et de vitrification</a> ou <a href="''' + DEVIS + '''">demandez un devis gratuit par SMS</a>.'''),
          "guide-preparer-appartement-poncage-parquet.html": P('''découvrez <a href="''' + SERV + '''">mon service de ponçage et de vitrification</a> ou <a href="''' + DEVIS + '''">réservez votre intervention avec un devis gratuit</a>.'''),
          }
          done=[]
          for fn, snip in SNIP.items():
              p=pathlib.Path(fn)
              if not p.exists(): print("MISSING", fn); continue
              s=p.read_text(encoding="utf-8")
              if 'class="maillage-argent"' in s: print("skip", fn); continue
              if "</article>" in s:
                  s=s.replace("</article>", snip + "\n</article>", 1)
              elif '<div class="cta">' in s:
                  s=s.replace('<div class="cta">', snip + '\n<div class="cta">', 1)
              else:
                  print("NO ANCHOR", fn); continue
              p.write_text(s, encoding="utf-8"); done.append(fn)
          print("INSERTED:", len(done))

          PY
      - name: commit
        run: |
          rm -f .github/workflows/deploy-maillage.yml
          git config user.name "François Gaillard"
          git config user.email "frafra92@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Maillage interne : liens contextuels articles vers pages argent (prix/services/devis/expert/specialiste)"
          git push
