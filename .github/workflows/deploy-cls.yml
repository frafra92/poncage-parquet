name: deploy-cls
on: workflow_dispatch
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: edits
        run: |
          python3 - <<'PY'
          import pathlib
          f = pathlib.Path("index.html")
          s = f.read_text(encoding="utf-8")
          anchor = '<link rel="preload" as="font" type="font/woff2" href="fonts/jost-latin-400-normal.woff2" crossorigin>'
          add = '<link rel="preload" as="font" type="font/woff2" href="fonts/jost-latin-300-normal.woff2" crossorigin>'
          if add not in s and anchor in s:
              s = s.replace(anchor, anchor + "\n" + add, 1)
              f.write_text(s, encoding="utf-8")
              print("ajoute")
          else:
              print("skip")
          PY
      - name: commit
        run: |
          rm -f .github/workflows/deploy-cls.yml
          git config user.name "François Gaillard"
          git config user.email "frafra92@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Perf/CLS: precharge Jost 300 (bloc hero-definition) pour supprimer le decalage de mise en page"
          git push
