name: Fix titles
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reecrit les titles
        run: python3 fix_titles.py
      - name: Nettoyage et commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch fix_titles.py .github/workflows/fix-titles.yml
          git add -A
          git diff --cached --quiet || git commit -m "Reecriture des titles des 3 pages les plus visitees [skip ci]"
          git push
