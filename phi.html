<body>

<div class="container">
  <div class="halo"></div>
  <img height="600" width="800" src="sacred-geometry-gold.jpg" alt="Géométrie sacrée · φ = 1.618" class="sacred-img">
</div>

<div class="phi-sign">φ · π · 1.618</div>

<script>
// ── Curseur personnalisé ──────────────────────────────────────────────────────
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
});

// ── Particules dorées ─────────────────────────────────────────────────────────
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
});

const PHI = 1.618;
const PI  = Math.PI;

// Générer des particules en spirale de Fibonacci
const particles = [];
const N = 144; // nombre de Fibonacci

for (let i = 0; i < N; i++) {
  const angle  = i * 2 * PI / (PHI * PHI); // angle doré
  const radius = Math.sqrt(i) * 18;
  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;

  particles.push({
    x: cx + Math.cos(angle) * radius,
    y: cy + Math.sin(angle) * radius,
    baseX: cx + Math.cos(angle) * radius,
    baseY: cy + Math.sin(angle) * radius,
    size:  Math.random() * 2 + 0.5,
    speed: Math.random() * 0.02 + 0.005,
    phase: Math.random() * PI * 2,
    opacity: Math.random() * 0.6 + 0.2,
  });
}

let frame = 0;

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  frame++;

  particles.forEach((p, i) => {
    // Mouvement orbital doux
    const t = frame * p.speed + p.phase;
    p.x = p.baseX + Math.cos(t) * 8;
    p.y = p.baseY + Math.sin(t * PHI) * 8;

    // Opacité pulsante
    const opacity = p.opacity * (0.5 + 0.5 * Math.sin(t * 2));

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, PI * 2);
    ctx.fillStyle = `rgba(201, 168, 76, ${opacity})`;
    ctx.fill();

    // Relier les particules proches
    for (let j = i + 1; j < Math.min(i + 5, particles.length); j++) {
      const q = particles[j];
      const dx = p.x - q.x;
      const dy = p.y - q.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 60) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(q.x, q.y);
        ctx.strokeStyle = `rgba(201, 168, 76, ${0.08 * (1 - dist/60)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  });

  requestAnimationFrame(drawParticles);
}

drawParticles();

// ── Interaction souris — attraction des particules ────────────────────────────
document.addEventListener('mousemove', e => {
  particles.forEach(p => {
    const dx = e.clientX - p.baseX;
    const dy = e.clientY - p.baseY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 120) {
      const force = (120 - dist) / 120 * 15;
      p.baseX += dx / dist * force * 0.02;
      p.baseY += dy / dist * force * 0.02;
    }
  });
});
</script>
